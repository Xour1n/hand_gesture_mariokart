    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marioRed: '#e60012',
                        bloodRed: '#8b0000',
                        bloodRedBright: '#b30000',
                        gameboyBlack: '#0a0a0a',
                        gameboyCard: '#121212',
                        gameboyBorder: '#262626'

                        'float': 'float 3s ease-in-out infinite',

                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },

                        twinkle: {
                            '0%': { opacity: '0.3', transform: 'scale(0.8)' },
                            '100%': { opacity: '1', transform: 'scale(1.3)' },

        }
    </script>

        .steer-left { transform: rotate(-45deg); }

    <img src="Group 11 (4).png" alt="Mushroom" class="fixed bottom-4 left-24 w-10 h-10 md:w-12 md:h-12 pointer-events-none rotate-12 z-50 drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)]">
    <img src="Group 11 (4).png" alt="Mushroom" class="fixed bottom-4 right-4 w-11 h-11 md:w-13 md:h-13 pointer-events-none -rotate-12 z-50 drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)]">

    <!-- MODAL SETTING FIREBASE -->

        <div class="bg-gameboyCard border-4 border-marioRed rounded-3xl p-6 w-full max-w-md shadow-[0_0_50px_rgba(230,0,18,0.5)] space-y-4 relative">
            <div class="flex justify-between items-center border-b border-gameboyBorder pb-3">
                <h3 class="text-base font-black text-bloodRedBright uppercase tracking-wider flex items-center gap-2">
                    <i class="fas fa-fire text-red-700"></i> Konfigurasi Firebase
                </h3>
                <button onclick="toggleModal(false)" class="text-gray-400 hover:text-white">

                </button>

                    <input type="text" id="fb-api-key" placeholder="AIzaSy..." class="w-full bg-black border border-gameboyBorder rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-marioRed">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1 uppercase tracking-wider">Database URL</label>
                    <input type="text" id="fb-db-url" placeholder="https://your-app-default-rtdb.firebaseio.com" class="w-full bg-black border border-gameboyBorder rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-marioRed">

            <div class="pt-2 flex justify-end gap-2">

                    Batal
                </button>
                <button onclick="initFirebase()" class="px-4 py-2 bg-marioRed hover:bg-red-600 text-white font-black text-xs rounded-xl shadow-lg transition uppercase tracking-wider border border-red-400">
                    Simpan & Connect
                </button>
            </div>
        </div>

<script type="text/javascript">
    function toggleModal(show) {
        const modal = document.getElementById('fb-modal');
        if (show) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        } else {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    }

    let dbRef = null;

    function initFirebase() {
        const apiKey = document.getElementById('fb-api-key').value.trim();
        const databaseURL = document.getElementById('fb-db-url').value.trim();

        if (!apiKey || !databaseURL) {
            alert("Harap isi API Key dan Database URL Firebase!");
            return;
        }

        try {
            const firebaseConfig = { apiKey, databaseURL };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            } else {
                firebase.app().delete().then(() => {
                    firebase.initializeApp(firebaseConfig);
                });
            }

            dbRef = firebase.database().ref('robot_control');
            document.getElementById('fb-status').innerText = "Terhubung";
            document.getElementById('fb-status').className = "text-green-500 font-bold";
            toggleModal(false);
            alert("Berhasil terhubung ke Firebase!");
        } catch(e) {
            console.error("Firebase Init Error:", e);
            document.getElementById('fb-status').innerText = "Gagal Konek";
            document.getElementById('fb-status').className = "text-red-500 font-bold";
            alert("Gagal konek Firebase. Periksa API Key / Database URL.");
        }
    }

    function sendToFirebase(command, mode) {
        if (dbRef) {
            dbRef.set({
                command: command,
                mode: mode,
                timestamp: Date.now()
            }).catch(err => console.error("Firebase Sync Error:", err));
        }
    }

    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/mZ_Qhc9ZT/";
    let model, webcam, labelContainer, maxPredictions;
    let bluetoothDevice, uartTxCharacteristic;
    let currentCommand = "stop";
    let isAiMode = false;

    const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_TX_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    async function connectBluetooth() {
        try {
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'BBC micro:bit' }],
                optionalServices: [UART_SERVICE_UUID]
            });

            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(UART_SERVICE_UUID);
            uartTxCharacteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);

            document.getElementById('ble-status').innerText = "Terhubung";
            document.getElementById('ble-status').className = "text-green-500 font-bold";
            document.getElementById('ble-btn-text').innerText = "Micro:bit Terhubung";
            document.getElementById('status-dot').className = "w-3 h-3 bg-green-500 rounded-full mt-1 shadow-[0_0_10px_rgba(34,197,94,0.9)] animate-pulse";
        } catch (error) {
            console.error("Bluetooth Gagal:", error);
            alert("Gagal/Dibatalkan terhubung dengan micro:bit.");
        }
    }

    function sendToMicrobit(command) {
        if (currentCommand === command) return;
        currentCommand = command;
        document.getElementById('last-cmd').innerText = command;

        sendToFirebase(command, isAiMode ? "AI_AUTOMATIC" : "MANUAL_STEERING");

        if (uartTxCharacteristic) {
            const encoder = new TextEncoder();
            uartTxCharacteristic.writeValue(encoder.encode(command + "\n"))
                .catch(err => console.error("Bluetooth TX Error:", err));
        }
    }

    function rotateSteeringWheel(direction) {
        const wheel = document.getElementById('steering-wheel');
        wheel.classList.remove('steer-left', 'steer-right', 'steer-up', 'steer-down', 'wheel-glow');
        
        if (direction === 'left') {
            wheel.classList.add('steer-left', 'wheel-glow');
        } else if (direction === 'right') {
            wheel.classList.add('steer-right', 'wheel-glow');
        } else if (direction === 'up') {
            wheel.classList.add('steer-up', 'wheel-glow');
        } else if (direction === 'down') {
            wheel.classList.add('steer-down', 'wheel-glow');
        }
    }

    function setupManualJoystick() {
        const buttons = {
            'bt-up': 'up',
            'bt-down': 'down',
            'bt-left': 'left',
            'bt-right': 'right'
        };

        Object.keys(buttons).forEach(id => {
            const btn = document.getElementById(id);
            const cmd = buttons[id];

            const startPress = (e) => {
                e.preventDefault();
                if (!isAiMode) {
                    rotateSteeringWheel(cmd);
                    sendToMicrobit(cmd);
                }
            };

            const endPress = (e) => {
                e.preventDefault();
                if (!isAiMode) {
                    rotateSteeringWheel('stop');
                    sendToMicrobit("stop");
                }
            };

            btn.addEventListener('mousedown', startPress);
            btn.addEventListener('mouseup', endPress);
            btn.addEventListener('mouseleave', endPress);
            btn.addEventListener('touchstart', startPress);
            btn.addEventListener('touchend', endPress);
        });
    }
    setupManualJoystick();

    async function toggleCamera() {
        if (!isAiMode) {
            document.getElementById('cam-btn-text').innerText = "Memuat AI...";
            if (!model) {
                const modelURL = MODEL_URL + "model.json";
                const metadataURL = MODEL_URL + "metadata.json";
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
            }

            const flip = true;
            webcam = new tmImage.Webcam(280, 280, flip);
            await webcam.setup();
            await webcam.play();

            document.getElementById('cam-placeholder').style.display = "none";
            document.getElementById('webcam-container').appendChild(webcam.canvas);

            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }

            isAiMode = true;
            document.getElementById('cam-btn-text').innerText = "Matikan Kamera";
            document.getElementById('btn-toggle-cam').classList.replace('bg-marioRed', 'bg-neutral-800');
            document.getElementById('mode-badge').innerText = "Mode: AI Gesture";
            document.getElementById('mode-badge').className = "px-4 py-2.5 rounded-2xl bg-marioRed border-2 border-bloodRedBright text-xs font-black text-white tracking-wider uppercase animate-pulse shadow-lg";

            window.requestAnimationFrame(loop);
        } else {
            isAiMode = false;
            if (webcam) webcam.stop();
            document.getElementById('webcam-container').innerHTML = "";
            document.getElementById('cam-placeholder').style.display = "flex";
            document.getElementById('label-container').innerHTML = "";
            
            document.getElementById('cam-btn-text').innerText = "Nyalakan Kamera";
            document.getElementById('btn-toggle-cam').classList.replace('bg-neutral-800', 'bg-marioRed');
            document.getElementById('mode-badge').innerText = "Mode: Manual Setir";
            document.getElementById('mode-badge').className = "px-4 py-2.5 rounded-2xl bg-black border-2 border-marioRed text-xs font-black text-bloodRedBright tracking-wider uppercase shadow-inner";

            rotateSteeringWheel('stop');
            sendToMicrobit("stop");
        }
    }

    async function loop() {
        if (!isAiMode) return;
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        let highestProb = 0;
        let bestClass = "stop";

        for (let i = 0; i < maxPredictions; i++) {
            const className = prediction[i].className;
            const probability = prediction[i].probability;

            labelContainer.childNodes[i].innerHTML = 
                `<div class="bg-black p-1.5 rounded-lg border border-gameboyBorder flex justify-between items-center">
                    <span class="capitalize text-gray-200 text-[11px] font-bold">${className}</span>
                    <span class="font-bold text-bloodRedBright text-[11px]">${(probability * 100).toFixed(0)}%</span>
                 </div>`;

            if (probability > highestProb) {
                highestProb = probability;
                bestClass = className.toLowerCase();
            }
        }

        if (highestProb < 0.65) bestClass = "stop";

        if (bestClass.includes("atas") || bestClass.includes("up") || bestClass.includes("maju")) {
            rotateSteeringWheel('up');
            sendToMicrobit("up");
        } else if (bestClass.includes("bawah") || bestClass.includes("down") || bestClass.includes("mundur")) {
            rotateSteeringWheel('down');
            sendToMicrobit("down");
        } else if (bestClass.includes("kiri") || bestClass.includes("left")) {
            rotateSteeringWheel('left');
            sendToMicrobit("left");
        } else if (bestClass.includes("kanan") || bestClass.includes("right")) {
            rotateSteeringWheel('right');
            sendToMicrobit("right");
        } else {
            rotateSteeringWheel('stop');
            sendToMicrobit("stop");
        }
    }
</script>
</body>
</html>
